# Builds both Windows exes in the cloud, so you don't need a Rust toolchain locally.
# Push to GitHub, open the "Actions" tab, run "build", download the artifact.
name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - name: Tests
        run: cargo test -p radial-core
      # The always-on launcher: smallest possible binary.
      - name: Build launcher (size-optimised)
        run: cargo build --release -p radial-launcher
      # The settings app only runs on demand: build it for speed, not size.
      - name: Build settings (speed-optimised)
        run: cargo build --release -p radial-settings
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_PANIC: unwind
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/radial-launcher.exe dist/
          Copy-Item target/release/radial-settings.exe dist/
          Get-ChildItem dist | Select-Object Name, @{n='KB';e={[int]($_.Length/1KB)}}
      - uses: actions/upload-artifact@v4
        with:
          name: radial-launcher-windows
          path: dist/*.exe
