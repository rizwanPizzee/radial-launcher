name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo test --lib
      - run: cargo build --release --bins
      - uses: actions/upload-artifact@v4
        with:
          name: radial-launcher-windows
          path: |
            target/release/radial-launcher.exe
            target/release/radial-launcher-settings.exe
